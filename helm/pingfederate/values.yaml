# Umbrella chart: the official ping-devops subchart (all its values live under
# the `ping-devops:` key) plus our own template (public ingress — see
# templates/ingress-pf.yaml). Topology: one admin Pod, one runtime engine.
# The public hostname is derived by convention: <release>-pingfederate-engine
# .ping-devops.com (wildcard TLS on the public nginx controller). No
# pf.publicHost value is needed; override it in deploy.sh only to deviate.

# Server profile (this repo's declarative PingFederate configuration) — a
# project pointer, not operator config. scripts/deploy.sh reads it from here.
profile:
  url: https://github.com/carbonefederico/ai-agentcore-token-exchange.git
  path: server-profiles/pingfederate-agentcore
  branch: main

ping-devops:
  global:
    ingress:
      enabled: false
    license:
      secret:
        devOps: devops-secret

  pingfederate-admin:
    enabled: true
    container:
      resources:
        requests:
          cpu: "1"
          memory: 2Gi
        limits:
          cpu: "2"
          memory: 4Gi

  pingfederate-engine:
    enabled: true
    container:
      replicaCount: 1
      resources:
        requests:
          cpu: "1"
          memory: 2Gi
        limits:
          cpu: "2"
          memory: 4Gi
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: pingfederate-engine
                    app.kubernetes.io/instance: pf
    workload:
      podDisruptionBudget:
        enabled: true
        minAvailable: 1
