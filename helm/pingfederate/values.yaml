# Single values file for the official ping-devops chart (deployed directly,
# no umbrella chart, no custom templates): chart-managed ingresses, 1 admin
# + 1 engine, token exchange configured via this repo's server profile.
# Subst variables for the profile's bulk config are supplied by
# scripts/deploy.sh (release-derived hostnames, generated p12 filedata);
# everything else lives here.

global:
  envs:
    PING_IDENTITY_ACCEPT_EULA: "YES"

  ingress:
    enabled: true
    defaultDomain: ping-devops.com
    addReleaseNameToHost: prepend
    annotations:
      nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
      kubernetes.io/ingress.class: "nginx-public"

pingfederate-admin:
  enabled: true

  envs:
    SERVER_PROFILE_URL: https://github.com/carbonefederico/ai-agentcore-token-exchange.git
    SERVER_PROFILE_PATH: server-profiles/pingfederate-agentcore
    SERVER_PROFILE_BRANCH: main

pingfederate-engine:
  enabled: true

  envs:
    SERVER_PROFILE_URL: https://github.com/carbonefederico/ai-agentcore-token-exchange.git
    SERVER_PROFILE_PATH: server-profiles/pingfederate-agentcore
    SERVER_PROFILE_BRANCH: main
