# PingFederate runtime engine ingress — the public surface for:
#   - AgentCore Runtime's OIDC discovery + JWKS fetches (external, from AWS)
#   - the CLI's Authorization Code + PKCE browser flows
#   - PingFederate's self-referential JWKS fetch (OUTPUT_JWKS_URL) — the PF
#     JVM trusts the controller's wildcard chain by default, no truststore.
# Standard ping-devops convention (as id41-pf): host derived from the release
# name; TLS served by the ingress-nginx-public controller's wildcard
# *.ping-devops.com certificate — no secretName, no cert-manager object.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pf-pingfederate-engine
  labels:
    app.kubernetes.io/name: pingfederate-engine
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    kubernetes.io/ingress.class: "nginx-public"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    nginx.ingress.kubernetes.io/proxy-body-size: "8m"
{{- $host := .Values.pf | default dict | dig "publicHost" (printf "%s-pingfederate-engine.ping-devops.com" .Release.Name) }}
spec:
  ingressClassName: "nginx-public"
  tls:
    - hosts:
        - {{ $host }}
  rules:
    - host: {{ $host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pf-pingfederate-engine
                port:
                  number: 9031
