# PingFederate admin console ingress — the management UI at
# https://<release>-pingfederate-admin.ping-devops.com behind the public
# nginx controller (TLS on the controller's wildcard *.ping-devops.com cert;
# admin serves HTTPS on 9999, hence backend-protocol HTTPS).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-pingfederate-admin
  labels:
    app.kubernetes.io/name: pingfederate-admin
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    kubernetes.io/ingress.class: "nginx-public"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
    nginx.ingress.kubernetes.io/proxy-ssl-verify: "off"
{{- $host := .Values.pf | default dict | dig "publicAdminHost" (printf "%s-pingfederate-admin.ping-devops.com" .Release.Name) }}
spec:
  ingressClassName: "nginx-public"
  tls:
    - hosts:
        - {{ $host }}
  rules:
    - host: {{ $host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-pingfederate-admin
                port:
                  number: 9999
