# cert-manager-managed TLS for the PingFederate public host (ClusterIssuer
# letsencrypt-pdo — same issuer the rest of the namespace uses). The secret
# pairs with ingress-pf.yaml.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Release.Name }}-pf-tls
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  secretName: {{ .Release.Name }}-pf-tls
  issuerRef:
    name: letsencrypt-pdo
    kind: ClusterIssuer
  dnsNames:
    - {{ .Values.pf.publicHost }}
